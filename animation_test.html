<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アニメーションのお試し</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <div class="work-detail">
        <main>
            <section class="work-description">
                <h1>アニメーション実験室</h1>
                <h2>JavaScript Animation Test</h2>
                <p>
                    ここは、JavaScriptを使ったアニメーションを試すためのページです。<br>
                    下のボタンを押すと、それぞれ違うアニメーションが始まります。
                </p>
            </section>

            <!-- アニメーション1: ネコちゃんお絵かき -->
            <section class="animation-playground">
                <h3>ネコちゃんお絵かき</h3>
                <button class="animation-trigger project-link" data-animation-type="draw-cat">ネコちゃんを描く！</button>
                <div id="animation-canvas"></div>
            </section>

            <!-- アニメーション2: キラキラ星 -->
            <section class="animation-playground">
                <h3>キラキラ星</h3>
                <button class="animation-trigger project-link" data-animation-type="sparkle-stars">魔法をかける！</button>
                <div class="animation-canvas"></div>
            </section>

            <a href="index.html#works" class="back-link">ポートフォリオに戻る</a>
        </main>
    </div>
    <script src="animation_test.js"></script>
</body>
</html>
